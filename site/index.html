<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#090b13">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23121623'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-size='34' fill='%23e5bf72'%3E%E9%BD%90%3C/text%3E%3C/svg%3E">
  <title>齐天伏妖录 · 十层妖途</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./screens.css">
</head>
<body>
  <main id="app">
    <div id="frame" aria-label="齐天伏妖录游戏画面">
      <canvas id="game" width="1280" height="720" tabindex="0"></canvas>
      <div id="rotate-hint">请横屏游玩<br><span>横过来后，触控按键会出现在屏幕两侧</span></div>
      <div id="screen-root" class="screen-root"></div>
      <div id="backpack-root" class="backpack-root"></div>
      <button id="battle-settings" class="battle-settings" type="button" aria-label="设置" title="设置">
        <svg viewBox="0 0 32 32" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13.3 5h5.4l.7 2.7 2.1 1.2 2.7-.8 2.7 4.7-1.9 2v2.4l1.9 2-2.7 4.7-2.7-.8-2.1 1.2-.7 2.7h-5.4l-.7-2.7-2.1-1.2-2.7.8-2.7-4.7 1.9-2v-2.4l-1.9-2 2.7-4.7 2.7.8 2.1-1.2z"/>
          <circle cx="16" cy="16" r="4.2"/>
        </svg>
      </button>
    </div>

    <div id="touch-ui" class="touch-ui">
      <div class="touch-move">
        <button class="touch-btn move" type="button" data-key="KeyA" aria-label="向左移动">
          <span class="glyph">◀</span>
          <small>左移</small>
        </button>
        <button class="touch-btn move" type="button" data-key="KeyD" aria-label="向右移动">
          <span class="glyph">▶</span>
          <small>右移</small>
        </button>
      </div>
      <div class="touch-actions">
        <button id="touch-backpack" class="touch-util" type="button" aria-label="打开背包">
          <span>囊</span>
        </button>
        <button class="touch-btn pause" type="button" data-key="Escape" aria-label="暂停">
          <span class="glyph">Ⅱ</span>
          <small>暂停</small>
        </button>
        <div class="touch-row small-row">
          <button class="touch-btn skill" type="button" data-key="KeyK" aria-label="破军">
            <span class="glyph">破</span>
            <small>破军</small>
          </button>
          <button class="touch-btn skill" type="button" data-key="KeyL" aria-label="烈焰">
            <span class="glyph">烈</span>
            <small>烈焰</small>
          </button>
          <button class="touch-btn skill" type="button" data-key="KeyU" aria-label="神威">
            <span class="glyph">神</span>
            <small>神威</small>
          </button>
        </div>
        <div class="touch-row">
          <button class="touch-btn dash" type="button" data-key="ShiftLeft" aria-label="闪避">
            <span class="glyph">闪</span>
            <small>闪避</small>
          </button>
          <button class="touch-btn jump" type="button" data-key="Space" aria-label="跳跃">
            <span class="glyph">跳</span>
            <small>二段跳</small>
          </button>
          <button class="touch-btn attack" type="button" data-key="KeyJ" aria-label="连击">
            <span class="glyph">棍</span>
            <small>连击</small>
          </button>
        </div>
      </div>
    </div>
    <p id="page-hint">A / D 移动 · 空格二段跳 · J 连击 · K 破军 · L 烈焰 · U 神威 · Shift 闪避</p>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
